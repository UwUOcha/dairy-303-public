  <text x="182" y="122" font-size="31" fill="#a6b2a1" letter-spacing="1">Между парами</text>

  <text x="80" y="296" font-size="58" font-weight="bold" fill="#f4f7ef" letter-spacing="-2">Пары — по плану.</text>
  <text x="80" y="370" font-size="58" font-weight="bold" fill="#b9f466" letter-spacing="-2">Время — для себя.</text>

  <text x="80" y="442" font-size="27" fill="#a6b2a1">Расписание вуза: неделя целиком, окна,</text>
  <text x="80" y="480" font-size="27" fill="#a6b2a1">преподаватели и общее свободное время.</text>

  <text x="80" y="551" font-size="24" fill="#79856f">Сайт, боты в Telegram и ВКонтакте — расписание одно.</text>

